name: Simple Zone iOS

on:
  push:
    branches: [main, 'claude/**']
    paths: ['simplezone/**', '.github/workflows/simplezone-ios.yml']
  pull_request:
    paths: ['simplezone/**', '.github/workflows/simplezone-ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: simplezone
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simplezone/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Read the live "Simplezone live" sheet like the app does
        env:
          LIVE_SHEET: '1'
        run: npx vitest run src/live-sheet.test.ts

      - name: Build the app's screens (with the screenshot tour) into the iPhone project
        # VITE_TOUR=1 adds sample businesses and steps through every screen. Only this check builds it;
        # the Web folder committed to the repo is the normal build.
        env:
          VITE_TOUR: '1'
        run: npm run ios:native

      - name: Build the iPhone app (SimpleZoneiOS) for the simulator
        run: |
          xcodebuild \
            -project SimpleZoneiOS/SimpleZone.xcodeproj \
            -target SimpleZone \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Screenshot every screen on a small and a large iPhone, light and dark
        run: |
          set -euo pipefail
          BUNDLE=com.auroraglance.simplezone
          APP="build/Debug-iphonesimulator/Simple Zone.app"
          mkdir -p screenshots
          # Use the newest iOS runtime, and only iPhone models it supports.
          RUNTIME=$(xcrun simctl list runtimes available -j | jq -c '[.runtimes[] | select(.platform == "iOS")] | last')
          RUNTIME_ID=$(echo "$RUNTIME" | jq -r .identifier)
          echo "Runtime: $(echo "$RUNTIME" | jq -r .name)"
          # The first model matching one of the patterns (in order), then an existing simulator of it, or a new one.
          pick() {
            local type="" pattern udid
            for pattern in "$@"; do
              type=$(echo "$RUNTIME" | jq -r --arg p "$pattern" '[.supportedDeviceTypes[] | select(.name | test($p))] | last | .identifier // empty')
              [ -n "$type" ] && break
            done
            if [ -z "$type" ]; then echo "::error::No iPhone model matches $*" >&2; return 1; fi
            udid=$(xcrun simctl list devices available -j | jq -r --arg r "$RUNTIME_ID" --arg t "$type" \
              '[.devices[$r][]? | select(.deviceTypeIdentifier == $t)] | first | .udid // empty')
            [ -z "$udid" ] && udid=$(xcrun simctl create "SZ test" "$type" "$RUNTIME_ID")
            echo "$udid"
          }
          # Small: iPhone SE, else the "e" model, else mini, else the standard model. Large: Pro Max, else Plus.
          SMALL=$(pick '^iPhone SE' '^iPhone [0-9]+e$' 'mini$' '^iPhone [0-9]+$')
          LARGE=$(pick 'Pro Max$' 'Plus$')
          FAILED=0
          for size in small large; do
            if [ "$size" = small ]; then DEVICE=$SMALL; else DEVICE=$LARGE; fi
            echo "== $size: $(xcrun simctl list devices -j | jq -r --arg u "$DEVICE" '.devices[][] | select(.udid == $u) | .name')"
            xcrun simctl boot "$DEVICE" || true
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl install "$DEVICE" "$APP"
            for look in light dark; do
              xcrun simctl ui "$DEVICE" appearance "$look"
              xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
              LOG="screenshots/console-$size-$look.txt"
              xcrun simctl launch --console-pty "$DEVICE" "$BUNDLE" > "$LOG" 2>&1 &
              sleep 1.5
              xcrun simctl io "$DEVICE" screenshot "screenshots/$size-$look-0-launch.png"
              n=1
              for screen in home search business about join; do
                # Wait for the app to say this screen is showing (up to 60s).
                for _ in $(seq 1 60); do grep -q "SZ-TOUR $screen" "$LOG" && break; sleep 1; done
                if ! grep -q "SZ-TOUR $screen" "$LOG"; then echo "::error::$size $look: $screen never showed"; FAILED=1; fi
                sleep 1.5
                xcrun simctl io "$DEVICE" screenshot "screenshots/$size-$look-$n-$screen.png"
                n=$((n + 1))
              done
              # The app must still be running (not crashed).
              xcrun simctl spawn "$DEVICE" launchctl list > running.txt
              if ! grep -q "$BUNDLE" running.txt; then echo "::error::$size $look: app stopped running"; FAILED=1; fi
              if grep -qiE "error|exception" "$LOG"; then echo "::warning::$size $look: errors in the console log"; grep -iE "error|exception" "$LOG" | head -20; fi
              xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
            done
            xcrun simctl shutdown "$DEVICE" || true
          done
          exit $FAILED

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simplezone-ios-screenshots
          path: simplezone/screenshots
          if-no-files-found: ignore
